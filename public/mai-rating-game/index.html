<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>舞萌猜Rating</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, sans-serif;
        }
        body {
            max-width: 700px;
            margin: 30px auto;
            padding: 0 20px;
        }
        .block {
            margin: 20px 0;
            padding: 16px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }
        button {
            padding: 10px 18px;
            cursor: pointer;
            border: none;
            border-radius: 6px;
            background: #3677ff;
            color: #fff;
            font-size: 15px;
        }
        button:disabled {
            background: #99b8f0;
            cursor: not-allowed;
        }
        .btn-abandon {
            background: #f04848;
        }
        input[type="number"] {
            width: 100%;
            padding: 10px;
            margin: 12px 0;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }
        .tip {
            font-size: 16px;
            font-weight: bold;
            margin: 10px 0;
        }
        .hidden {
            display: none;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        td, th {
            border: 1px solid #eee;
            padding: 8px;
            font-size: 14px;
        }
        .song-item {
            margin: 12px 0;
            padding: 10px;
            border: 1px solid #eee;
            border-radius: 6px;
        }
        .dev-info {
            margin-top: 40px;
            text-align: center;
            font-size: 13px;
            color: #666;
        }
        .dev-info a {
            color: #3677ff;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <h1>舞萌猜Rating</h1>
    <div class="block">
        <button id="startBtn">开始游戏</button>
    </div>
    <div id="gamePanel" class="block hidden">
        <h3>3条随机线索</h3>
        <div id="clueBox"></div>
        <input type="number" id="ratingInput" placeholder="输入猜测总Rating">
        <!-- 新增：剩余次数+允许误差提示 -->
        <div id="gameHint" class="tip" style="font-weight:normal;font-size:14px;"></div>
        <button id="submitBtn">提交答案</button>
        <div id="tipText" class="tip"></div>
        <br>
        <button id="abandonBtn" class="btn-abandon">放弃本局</button>
    </div>
    <div id="resultPanel" class="block hidden">
        <h2>游戏结算</h2>
        <p class="tip">真实总Rating：<span id="realTotal"></span></p>
        <div>
            <h3>B35 前5首</h3>
            <table id="b35Table">
                <tr>
                    <th>序号</th>
                    <th>曲名</th>
                    <th>等级</th>
                    <th>评级</th>
                    <th>DX星级</th>
                    <th>完成度</th>
                    <th>单曲Rating</th>
                </tr>
            </table>
        </div>
        <div style="margin-top:20px">
            <h3>B15 前5首</h3>
            <table id="b15Table">
                <tr>
                    <th>序号</th>
                    <th>曲名</th>
                    <th>等级</th>
                    <th>评级</th>
                    <th>DX星级</th>
                    <th>完成度</th>
                    <th>单曲Rating</th>
                </tr>
            </table>
        </div>
    </div>
    <!-- 改动1：底部开发者标识 -->
    <div class="dev-info">
        开发者：Chengzi600 | <a href="https://blog.zhaozilin.cn" target="_blank">个人主页</a>
    </div>
    <script>
        const BACKEND_URL = "https://api.zhaozilin.cn/rating-game/v0/createChallenge";
        // 改动4：修改允许误差、最大猜测次数
        const WIN_OFFSET = 200;
        const MAX_GUESS = 5;
        let gameData = {
            targetRating: 0,
            clueList: [],
            b35Top5: [],
            b15Top5: [],
            guessCount: 0 // 记录当前猜测次数
        };
        const startBtn = document.getElementById("startBtn");
        const gamePanel = document.getElementById("gamePanel");
        const resultPanel = document.getElementById("resultPanel");
        const clueBox = document.getElementById("clueBox");
        const ratingInput = document.getElementById("ratingInput");
        const submitBtn = document.getElementById("submitBtn");
        const abandonBtn = document.getElementById("abandonBtn");
        const tipText = document.getElementById("tipText");
        const realTotal = document.getElementById("realTotal");
        const b35Table = document.getElementById("b35Table");
        const b15Table = document.getElementById("b15Table");
        // 新增提示框元素
        const gameHint = document.getElementById("gameHint");

       async function startGame() {
    // 统一捕获所有逻辑+网络异常
    try {
        // 全部DOM操作放入try，DOM报错也能捕获
        if (!startBtn || !gamePanel || !resultPanel || !tipText || !ratingInput || !clueBox) {
            throw new Error("页面DOM元素缺失，请检查HTML");
        }
        startBtn.disabled = true;
        gamePanel.classList.remove("hidden");
        resultPanel.classList.add("hidden");
        tipText.textContent = "";
        ratingInput.value = "";
        clueBox.innerHTML = "";
        gameData.guessCount = 0;
        updateHint();

        const res = await fetch(BACKEND_URL);
        // 手动判断HTTP状态码，区分接口报错和网络报错
        if (!res.ok) {
            throw new Error(`接口异常，状态码：${res.status}`);
        }
        const data = await res.json();
        if (!data.success) {
            alert(data.msg);
            gamePanel.classList.add("hidden");
            startBtn.disabled = false;
            return;
        }
        gameData.targetRating = data.totalRating;
        gameData.clueList = data.clues;
        gameData.b35Top5 = data.b35Top5;
        gameData.b15Top5 = data.b15Top5;
        renderClue();
    } catch (err) {
        // 区分错误类型，精准定位问题
        console.error("游戏启动失败：", err);
        if (err.message.includes("DOM元素缺失")) {
            alert("页面加载异常，缺失页面组件，请刷新重试");
        } else if (err.message.includes("状态码")) {
            alert(`后端接口报错：${err.message}，后端服务已启动但接口异常`);
        } else if (err.name === "TypeError" && err.message.includes("fetch")) {
            alert("无法连接后端，请检查后端服务、地址、跨域配置");
        } else {
            alert(`启动失败：${err.message}`);
        }
        // 统一重置界面
        gamePanel.classList.add("hidden");
        startBtn.disabled = false;
    }
}

        // 更新次数&误差提示
        function updateHint() {
            const left = MAX_GUESS - gameData.guessCount;
            gameHint.textContent = `允许误差±${WIN_OFFSET}，剩余猜测次数：${left}次`;
        }

        function renderClue() {
            let html = "";
            gameData.clueList.forEach(item => {
                const jacketUrl = `https://assets2.lxns.net/maimai/jacket/${item.id}.png`;
                console.log("当前曲目曲绘链接：", jacketUrl, "曲目ID：", item.id, "曲目名称：", item.songName);
                html += `
                <div class="song-item">
                    <img src="${jacketUrl}" alt="曲绘" style="width:120px;height:auto;border-radius:4px;margin-bottom:8px;" loading="lazy">
                    <!-- 改动3：删除tag渲染，不再显示B1/R1 -->
                    <p>曲名：${item.songName}</p>
                    <p>等级：${item.level}</p>
                    <p>评级：${item.rate}｜DX星级：${item.dxStar}</p>
                    <p>完成度：${item.achievements}</p>
                    <p>单曲Rating：${item.dxRating}</p>
                </div>
                `;
            });
            clueBox.innerHTML = html;
        }

        function submitGuess() {
            // 次数耗尽直接结算
            if (gameData.guessCount >= MAX_GUESS) {
                tipText.textContent = "猜测次数已用尽，自动查看结果";
                tipText.className = "tip lose";
                setTimeout(showResult, 1000);
                return;
            }
            const guessVal = Number(ratingInput.value.trim());
            if (isNaN(guessVal) || guessVal <= 0) {
                tipText.textContent = "请输入有效的数字";
                tipText.className = "tip lose";
                return;
            }
            // 次数+1
            gameData.guessCount += 1;
            updateHint();

            const diff = Math.abs(guessVal - gameData.targetRating);
            if (diff <= WIN_OFFSET) {
                tipText.textContent = `回答正确！允许误差±${WIN_OFFSET}`;
                tipText.className = "tip win";
                setTimeout(showResult, 1200);
            } else if (guessVal > gameData.targetRating) {
                tipText.textContent = "猜大了，真实总Rating更小";
                tipText.className = "tip lose";
            } else {
                tipText.textContent = "猜小了，真实总Rating更大";
                tipText.className = "tip lose";
            }
        }

        function showResult() {
            gamePanel.classList.add("hidden");
            resultPanel.classList.remove("hidden");
            realTotal.textContent = gameData.targetRating;
            b35Table.innerHTML = `<tr><th>序号</th><th>曲名</th><th>等级</th><th>评级</th><th>DX星级</th><th>完成度</th><th>单曲Rating</th></tr>`;
            gameData.b35Top5.forEach(item => {
                const tr = document.createElement("tr");
                tr.innerHTML = `<td>${item.tag}</td><td>${item.songName}</td><td>${item.level}</td><td>${item.rate}</td><td>${item.dxStar}</td><td>${item.achievements}</td><td>${item.dxRating}</td>`;
                b35Table.appendChild(tr);
            });
            b15Table.innerHTML = `<tr><th>序号</th><th>曲名</th><th>等级</th><th>评级</th><th>DX星级</th><th>完成度</th><th>单曲Rating</th></tr>`;
            gameData.b15Top5.forEach(item => {
                const tr = document.createElement("tr");
                tr.innerHTML = `<td>${item.tag}</td><td>${item.songName}</td><td>${item.level}</td><td>${item.rate}</td><td>${item.dxStar}</td><td>${item.achievements}</td><td>${item.dxRating}</td>`;
                b15Table.appendChild(tr);
            });
            startBtn.disabled = false;
        }
        startBtn.addEventListener("click", startGame);
        submitBtn.addEventListener("click", submitGuess);
        abandonBtn.addEventListener("click", showResult);
    </script>
</body>
</html>
